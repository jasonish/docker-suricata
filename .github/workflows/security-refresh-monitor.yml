name: security-refresh-monitor

on:
  schedule:
    - cron: "37 21 * * *"
  workflow_dispatch:

# Observation only: no builds, registry credentials, or pushes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    name: ${{ matrix.tag }} / ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tag: ["8.0", "8.0-profiling"]
        arch: ["amd64", "arm64"]
    steps:
      - name: Install pinned Trivy
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          cd "$RUNNER_TEMP/trivy-bin"
          curl --fail --location --retry 3 \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz \
            --output trivy.tar.gz
          echo 'bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  trivy.tar.gz' | sha256sum --check
          tar -xzf trivy.tar.gz trivy
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Scan published image and report rebuild recommendation
        env:
          IMAGE: docker.io/jasonish/suricata:${{ matrix.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p reports
          trivy image --image-src remote --platform "linux/$ARCH" \
            --scanners vuln --pkg-types os --ignore-unfixed --list-all-pkgs \
            --timeout 15m --format json --output reports/trivy.json "$IMAGE"

          # Missing OS/package detection must not be mistaken for a clean scan.
          jq -e '
            .Metadata.OS.Family == "alma" and
            (.Metadata.OS.Name | test("^9([.]|$)")) and
            any(.Results[]?; .Class == "os-pkgs" and .Type == "alma" and
              (.Packages | length) > 0)
          ' reports/trivy.json > /dev/null
          count=$(jq '[.Results[]? | select(.Class == "os-pkgs") |
            .Vulnerabilities[]?] | unique_by([.PkgName, .VulnerabilityID]) | length' reports/trivy.json)
          if [ "$count" -gt 0 ]; then
            decision="REBUILD WARRANTED: $count fixable OS-package findings"
          else
            decision="NO REBUILD INDICATED: no known-fixable OS-package findings"
          fi
          echo "::notice::$IMAGE ($ARCH): $decision. Observation only; no images built or published."
          {
            echo "## $IMAGE ($ARCH)"
            echo "$decision"
            echo
            echo 'Observation only: no candidate build or publication. Findings do not prove a rebuild will fix them.'
            echo 'Coverage: AlmaLinux OS advisories; not comprehensive EPEL or source-built application coverage.'
          } | tee reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate incomplete checks
        if: ${{ failure() || cancelled() }}
        run: |
          echo '::warning::INCONCLUSIVE: security scan did not complete. No images were published.'
          echo '### INCONCLUSIVE: monitoring failed or was interrupted; no images published.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve scan report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-refresh-${{ matrix.tag }}-${{ matrix.arch }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
